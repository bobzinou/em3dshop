<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement réussi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .success-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 50px 40px;
      text-align: center;
      max-width: 500px;
    }
    
    .checkmark {
      width: 80px;
      height: 80px;
      background: #4CAF50;
      border-radius: 50%;
      margin: 0 auto 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      color: white;
    }
    
    h1 {
      color: #333;
      margin-bottom: 15px;
      font-size: 28px;
    }
    
    p {
      color: #666;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    
    .order-id {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      color: #333;
      font-weight: bold;
    }
    
    .countdown {
      color: #999;
      font-size: 14px;
      margin-top: 30px;
    }
    
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    
    a:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="checkmark">✅</div>
    <h1>Paiement réussi !</h1>
    <p>Merci pour votre commande.</p>
    <p>Une facture a été envoyée à votre adresse email.</p>
    
    <div class="order-id" id="order-id-display"></div>
    
    <p class="countdown">Retour automatique dans <strong id="countdown">3</strong> secondes...</p>
    
    <a href="/">Retour à l'accueil</a>
  </div>

  <script>
    // Récupère l'orderId de l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    
    if (orderId) {
      document.getElementById("order-id-display").innerHTML = `<strong>Commande :</strong> ${orderId}`;
    }
    
    // Countdown avant fermeture
    let countdown = 3;
    const countdownEl = document.getElementById("countdown");
    
    const timer = setInterval(() => {
      countdown--;
      countdownEl.textContent = countdown;
      
      if (countdown <= 0) {
        clearInterval(timer);
        window.close(); // Ferme la popup
      }
    }, 1000);
  </script>
</body>
</html>
